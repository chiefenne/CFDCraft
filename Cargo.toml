[workspace]
resolver = "3"
members = [
    "crates/inncraft-core",
    "crates/inncraft-kernels",
    "crates/inncraft-parallel",
    "crates/inncraft-mesh",
    "crates/inncraft-fv",
    "crates/inncraft-flow",
    "crates/inncraft-bench",
    "crates/inncraft-cli",
]
# Built separately with the nightly toolchain for the NVIDIA PTX target
# (see gpu/ptx-kernels/README.md).
exclude = ["gpu/ptx-kernels"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/chiefenne/Inncraft"
authors = ["Andreas Ennemoser"]

[workspace.dependencies]
inncraft-core = { path = "crates/inncraft-core", version = "0.4.0" }
inncraft-kernels = { path = "crates/inncraft-kernels", version = "0.4.0" }
inncraft-parallel = { path = "crates/inncraft-parallel", version = "0.4.0" }
inncraft-mesh = { path = "crates/inncraft-mesh", version = "0.4.0", default-features = false }
inncraft-fv = { path = "crates/inncraft-fv", version = "0.4.0", default-features = false }
inncraft-flow = { path = "crates/inncraft-flow", version = "0.4.0", default-features = false }
inncraft-bench = { path = "crates/inncraft-bench", version = "0.4.0" }
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
mpi = "0.8"
hdf5-metno = { version = "0.15", features = ["static"] }
metis = "0.2"
cudarc = { version = "0.19", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
