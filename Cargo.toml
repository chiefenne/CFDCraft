[workspace]
resolver = "3"
members = [
    "crates/ennecraft-core",
    "crates/ennecraft-kernels",
    "crates/ennecraft-parallel",
    "crates/ennecraft-mesh",
    "crates/ennecraft-fv",
    "crates/ennecraft-flow",
    "crates/ennecraft-bench",
    "crates/ennecraft-cli",
]
# Built separately with the nightly toolchain for the NVIDIA PTX target
# (see gpu/ptx-kernels/README.md).
exclude = ["gpu/ptx-kernels"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/chiefenne/Ennecraft"
authors = ["Andreas Ennemoser"]

[workspace.dependencies]
ennecraft-core = { path = "crates/ennecraft-core", version = "0.4.0" }
ennecraft-kernels = { path = "crates/ennecraft-kernels", version = "0.4.0" }
ennecraft-parallel = { path = "crates/ennecraft-parallel", version = "0.4.0" }
ennecraft-mesh = { path = "crates/ennecraft-mesh", version = "0.4.0", default-features = false }
ennecraft-fv = { path = "crates/ennecraft-fv", version = "0.4.0", default-features = false }
ennecraft-flow = { path = "crates/ennecraft-flow", version = "0.4.0", default-features = false }
ennecraft-bench = { path = "crates/ennecraft-bench", version = "0.4.0" }
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
mpi = "0.8"
hdf5-metno = { version = "0.15", features = ["static"] }
metis = "0.2"
cudarc = { version = "0.19", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
