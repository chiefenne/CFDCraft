[package]
name = "cfdcraft-cli"
description = "CFDCraft command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cfdcraft"
path = "src/main.rs"

[features]
default = ["hdf5", "metis"]
# VTKHDF output (HDF5 built from source; needs CMake and a C compiler).
hdf5 = ["cfdcraft-mesh/hdf5", "cfdcraft-fv/hdf5", "cfdcraft-flow/hdf5"]
# METIS partitioning (built from source).
metis = ["cfdcraft-mesh/metis"]
cuda = ["cfdcraft-bench/cuda", "cfdcraft-fv/cuda"]
# hypre as the reference solver of `cfdcraft poisson` (needs HYPRE_DIR).
hypre = ["cfdcraft-fv/hypre"]
mpi = ["cfdcraft-parallel/mpi"]
checked-indexing = ["cfdcraft-bench/checked-indexing"]

[dependencies]
cfdcraft-core.workspace = true
cfdcraft-bench.workspace = true
cfdcraft-mesh.workspace = true
cfdcraft-fv.workspace = true
cfdcraft-flow.workspace = true
cfdcraft-parallel.workspace = true
clap.workspace = true
anyhow = "1"
rayon.workspace = true

[lints]
workspace = true
