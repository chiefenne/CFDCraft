[package]
name = "cfdcraft-fv"
description = "CFDCraft finite-volume operators on a scalar: least-squares gradients, limiters, convection and diffusion, sliced-ELL assembly, BiCGStab, on the CPU and the NVIDIA GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["hdf5"]
# VTKHDF output of the fields (HDF5 built from source).
hdf5 = ["cfdcraft-mesh/hdf5"]
# METIS available for the mesh case (not needed by the operators).
metis = ["cfdcraft-mesh/metis"]
# NVIDIA GPU backend: the kernel bodies as PTX (gpu/ptx-kernels), loaded at
# run time through the CUDA driver; a build needs no CUDA toolkit.
cuda = ["dep:cudarc"]

[dependencies]
cfdcraft-core.workspace = true
cfdcraft-kernels.workspace = true
cfdcraft-mesh.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow = "1"
cudarc = { workspace = true, optional = true, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"] }

[lints]
workspace = true
