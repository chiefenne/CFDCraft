[package]
name = "ennecraft-cli"
description = "Ennecraft command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ennecraft"
path = "src/main.rs"

[features]
default = ["hdf5", "metis"]
# VTKHDF output (HDF5 built from source; needs CMake and a C compiler).
hdf5 = ["ennecraft-mesh/hdf5", "ennecraft-fv/hdf5", "ennecraft-flow/hdf5"]
# METIS partitioning (built from source).
metis = ["ennecraft-mesh/metis"]
cuda = ["ennecraft-bench/cuda", "ennecraft-fv/cuda"]
# hypre as the reference solver of `ennecraft poisson` (needs HYPRE_DIR).
hypre = ["ennecraft-fv/hypre"]
mpi = ["ennecraft-parallel/mpi"]
checked-indexing = ["ennecraft-bench/checked-indexing"]

[dependencies]
ennecraft-core.workspace = true
ennecraft-bench.workspace = true
ennecraft-mesh.workspace = true
ennecraft-fv.workspace = true
ennecraft-flow.workspace = true
ennecraft-parallel.workspace = true
clap.workspace = true
anyhow = "1"
rayon.workspace = true

[lints]
workspace = true
