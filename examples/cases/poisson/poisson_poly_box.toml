# The pressure solver (stage 3) on polyhedral meshes: CG with the
# smoothed-aggregation multigrid in mixed precision, against the same
# hierarchy in float64 and against Jacobi-preconditioned CG, over
# four refinement levels (729 to 274 625 cells).
#
#   cargo run --release -p foehncraft-cli -- poisson examples/cases/poisson/poisson_poly_box.toml
#
# −∇·(Γ∇φ) = s on the unit box with Γ = 1, s and the boundary values from
# the manufactured solution φ = 1 + sin(πx + 0.5) cos(πy + 0.3) cos(πz/2 + 0.2).
# Each level is solved from φ = 0 to ‖b − Aφ‖ ≤ 1e-10 ‖b‖. The run fails if
# the multigrid iterations on the finest level are more than 1.5 times
# those on the coarsest, if a solution differs from the first one by more
# than 1e-6 (relative), or if a solver differs between the backends (4
# threads and 1 thread: bitwise equal).

case_format = "0.6"

[mesh.generate]
type = "poly"          # polyhedra (dual of a tetrahedral mesh)
cells = [4, 4, 4]      # base intervals; [study] levels refine them
perturb = 0.15         # random node displacement, fraction of the interval

[mesh]
renumber = "rcm"

[problem]
diffusivity = 1.0
velocity = [0.0, 0.0, 0.0]
manufactured = {}

[problem.boundary.xmin]
type = "fixed-value"
profile = "manufactured"
[problem.boundary.xmax]
type = "fixed-value"
profile = "manufactured"
[problem.boundary.ymin]
type = "fixed-value"
profile = "manufactured"
[problem.boundary.ymax]
type = "fixed-value"
profile = "manufactured"
[problem.boundary.zmin]
type = "fixed-value"
profile = "manufactured"
[problem.boundary.zmax]
type = "fixed-value"
profile = "manufactured"

[linear]
tolerance = 1e-10

[linear.amg]
smoother = "chebyshev"
degree = 2
precision = "mixed"

[study]
levels = [1, 2, 3, 4]
solvers = ["amg", "amg-double", "jacobi"]
backends = ["cpu", "cpu-serial"]
max_iteration_ratio = 1.5
