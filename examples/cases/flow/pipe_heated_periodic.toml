# Short periodic heated pipe, laminar (stage 6 part 6p, D109, D111): the
# main validation case of periodic heat transfer on a module of one
# diameter.
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/pipe_heated_periodic.toml
#
# Pipe of radius R = 0.5 m (D = 1 m) on an axisymmetric wedge of 0.5°
# (pipe_wedge.toml), module length 1 m = D, the inlet and outlet planes one
# periodic pair. The flow is driven by the mass flow of U = 1 m/s through
# the wedge section ½ R² sin θ (Re = 10; the driving force converges to
# the Hagen–Poiseuille gradient 8 μ U / R² = 3.2 Pa/m, the pressure-gradient
# mode of the pair is the other choice). A passive temperature with Γ = 1e-3 m²/s
# (Pe = U D / Γ = 1000) takes the wall flux q = 1e-3 K m/s and crosses the
# pair with the heat-flux jump Δ = Q/ṁ of D109 (1). The thermally developed
# solution, r² = y² + z²,
#
#   T = G x + (q / (Γ R)) (r² − r⁴ / (4 R²)),   G = 2 q / (U R),
#
# has the bulk value 7/24 q R / Γ at x = 0 (the level) and the wall value
# 3/4 q R / Γ above G x, so with the hydraulic diameter D
#
#   Nu = q D / (Γ (T_w − T_b)) = 48/11 = 4.3636,
#
# the laminar value of a pipe with uniform wall heat flux. Three nested
# meshes (8 x 8, 16 x 16 and 32 x 32 cells in the x–r plane): the velocity
# error falls at order 1.8 to 2.2, the temperature error at 1.8 to 2.6
# (slightly above two on these coarse meshes), Nu on the finest mesh lies
# within 0.5 % of 48/11. A module of one diameter replaces a pipe of
# 50 diameters and more for the thermal entry length.

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
upper = [1.0, 0.5, 0.1]
cells = [8, 8, 1]
perturb = 0.15
wedge = 0.5            # degrees about the x axis; y is the radius

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 0.1

[constants]
R = 0.5
q = 1e-3               # wall heat flux over ρ c_p (K m/s)
Gamma = 1e-3
u_mean = 1.0
G = "2 * q / (u_mean * R)"

[scalars.theta]
diffusivity = 1e-3
initial = 0.0
exact = "G * x + q / (Gamma * R) * ((y^2 + z^2) - (y^2 + z^2)^2 / (4 * R^2))"

[boundary.xmin]
type = "periodic"
partner = "xmax"
mass_flow = 1.0908169e-3     # kg/s: ρ U ½ R² sin(0.5°)
[boundary.xmin.scalar.theta]
periodic = "heat-flux"
bulk = 0.14583333333333334   # 7/24 q R / Γ, the bulk value at x = 0
[boundary.xmax]
type = "periodic"
[boundary.ymax]
type = "wall"
[boundary.ymax.scalar.theta]
flux = "q"
[boundary.zmin]
type = "wedge"
[boundary.zmax]
type = "wedge"

[solver]
tolerance = 1e-9
max_iterations = 5000

[solver.momentum]
relaxation = 0.9

[solver.scalar]
scheme = "linear-upwind"
# the smooth minimum of T on the axis needs no limiter; the default one
# clips it in the prisms next to the axis and costs the order on the
# perturbed meshes (1.3 instead of 2.2 on the fourth mesh)
limiter = "none"

[analytic]
type = "pipe-poiseuille"
radius = 0.5
mean_velocity = 1.0
x_outlet = 1.0

[verification]
levels = [0, 1, 2]
expected_order = [1.8, 2.2]
scalar_order = [1.8, 2.6]    # observed 2.30, 2.28 (2.19 on the next mesh)
require_convergence = true

[output]
vtkhdf = false
wall_csv = false
