# Plane Couette flow on perturbed tet cells, Stokes flow (stage 4).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/couette_tet.toml
#
# Channel 0 < y < 1 of length 2, lower wall at rest, upper wall moving at
# 1 m/s, the exact linear velocity at the inlet and a static pressure outlet.
# The linear profile is represented exactly by the discretisation, so the
# error must be at round-off level (D27 acceptance). The run fails if the
# relative L2 velocity error exceeds 1e-9.

[mesh.generate]
type = "tet"
dimension = 2
upper = [2.0, 1.0, 0.1]
cells = [16, 8, 1]
perturb = 0.15

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 0.1          # Re = ρ U h / μ = 10

[flow]
convection = false

[boundary.xmin]
type = "velocity-inlet"
profile = "analytic"     # the exact Couette profile
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymin]
type = "wall"
[boundary.ymax]
type = "wall"
velocity = [1.0, 0.0, 0.0]
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-11
max_iterations = 2000

[analytic]
type = "couette"
wall_velocity = 1.0

[verification]
max_error = 1e-9
require_convergence = true
