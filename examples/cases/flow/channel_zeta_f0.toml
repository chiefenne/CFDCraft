# Fully developed turbulent channel flow at Re_τ ≈ 395, k-ε-ζ-f₀
# (Popovac 2023) with the compound wall treatment of the same paper
# (stage 6 part 6d2, D132, D134, specification 9.4).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/channel_zeta_f0.toml
#
# The channel of channel_zeta_f.toml on 48 cells across (ratio 27.32
# between the centre and the wall cell): the first-cell y⁺ is 1. U_b⁺ =
# 17.55/√F follows from the driving force F in the log (u_τ = √(F h/ρ)).
#
# ζ-f₀ solves f₀ = f + ζ/T, which is zero at the wall, instead of the f of
# 2004, whose wall value −2νζ/y² is stiff. The sink of k is
# max(k/T_K, 2νk/d²), d the wall distance and T_K the time scale with its
# Kolmogorov bound: it is ε at the wall, so that k falls like y² and the
# wall value of ε converges with the mesh, and k/T_K away from walls
# (`turbulence.k_sink`, docs/requirements/stage6-turbulence.md 3.3.2).
# C_ε1 = 1.4 (1 + 0.009/ζ) replaces the printed 1.4 (1 + 0.012/√ζ).
#
# The coupled algorithm (D178) converges the case in about 230
# iterations, against 2 100 with SIMPLEC, with the same U_b⁺.
#
# Result: U_b⁺ = 17.34, −1.2 % from the DNS of Moser, Kim & Mansour (band
# ±3 %). On 96, 192 and 384 cells across: 17.54, 17.58, 17.58 (+0.2 %;
# examples/studies/plate_channel_gci.py). With the first cell at y⁺ 10 /
# 30: −3.4 % / −1.2 % (ζ-f with its 2007 treatment: −7.1 % / +4.8 %).

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
upper = [0.1, 2.0, 0.1]
cells = [2, 48, 1]
grading = { y = { ratio = 27.32, symmetric = true } }

[fluid]
density = 1.0
viscosity = 0.0025316455696202532   # 1/395

[turbulence]
model = "k-epsilon-zeta-f0"
wall_treatment = "compound-2023"

[initial]
velocity = [15.0, 0.0, 0.0]
turbulence_intensity = 0.05
viscosity_ratio = 100.0

[boundary.xmin]
type = "periodic"
partner = "xmax"
mass_flow = 3.51
[boundary.xmax]
type = "periodic"
[boundary.ymin]
type = "wall"
[boundary.ymax]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
algorithm = "coupled"
tolerance = 1e-6
max_iterations = 1000

[output]
vtkhdf = false
wall_csv = true
lines = [ { name = "profile", from = [0.05, 0.0, 0.05], to = [0.05, 1.0, 0.05], points = 200 } ]
