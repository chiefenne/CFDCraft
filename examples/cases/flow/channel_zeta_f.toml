# Fully developed turbulent channel flow at Re_τ ≈ 395, k-ε-ζ-f
# (Hanjalić, Popovac & Hadžiabdić 2004) with the compound wall treatment
# (stage 6 part 6d, D132, D134, specification 9.4).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/channel_zeta_f.toml
#
# The channel of channel_sst.toml (0 < y < 2h, h = 1 m, ν = 1/395 m²/s,
# periodic module of 0.1 m, mass flow 3.51 kg/s: U_b = 17.55 m/s, the DNS
# bulk velocity of Moser, Kim & Mansour (1999) at u_τ = 1 m/s). The
# solver adjusts the body force F = τ_w/h, so u_τ = √(F h/ρ) and
# U_b⁺ = 17.55/√F follow from the driving force in the log.
#
# 96 cells across, graded symmetrically (ratio 60 between the centre and
# the wall cell): the first-cell y⁺ is 0.27, where the compound treatment
# is the integration to the wall (k = ζ = 0 by zero gradient, ε and f of
# the viscous sublayer). The profile line gives U, k, ε, ν_t, ζ = v²/k
# and f across the channel.
#
# Result: U_b⁺ = 17.87, +1.8 % from the DNS (band ±3 %, specification
# 9.4), in about 370 iterations of the coupled algorithm (D178; 3 700
# with SIMPLEC, same U_b⁺); `wall_treatment = "low-re"` (Dirichlet
# values at the wall) gives 17.77, +1.2 %. Near the wall U⁺ follows the
# DNS to y⁺ ≈ 25; the log layer lies slightly above it.

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
upper = [0.1, 2.0, 0.1]
cells = [2, 96, 1]
grading = { y = { ratio = 60.0, symmetric = true } }

[fluid]
density = 1.0
viscosity = 0.0025316455696202532   # 1/395

[turbulence]
model = "k-epsilon-zeta-f"
wall_treatment = "compound"

[initial]
velocity = [15.0, 0.0, 0.0]
turbulence_intensity = 0.05
viscosity_ratio = 100.0

[boundary.xmin]
type = "periodic"
partner = "xmax"
mass_flow = 3.51
[boundary.xmax]
type = "periodic"
[boundary.ymin]
type = "wall"
[boundary.ymax]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
algorithm = "coupled"
tolerance = 1e-6
max_iterations = 1000

[output]
vtkhdf = false
wall_csv = true
lines = [ { name = "profile", from = [0.05, 0.0, 0.05], to = [0.05, 1.0, 0.05], points = 200 } ]
