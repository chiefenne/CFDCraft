# A heated wall cooled by a channel flow: the first conjugate heat
# transfer case (stage 7d1, D157).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/cht_heated_wall.toml
#
# A plane channel of height h = 1 m over a solid wall 0.2 m thick, 4 m
# long. Air-like fluid at Re = U h/ν = 100 and Pr = 0.71 enters at
# 300 K with a uniform 1 m/s; the outer face of the wall takes 1000 W/m²,
# the top of the channel and the ends of the wall are adiabatic. One mesh
# holds both regions: the flow runs on the fluid cells, where the faces
# against the wall become the no-slip boundary `interface-wall`; the
# temperature runs on all cells, with the series conductance of the two
# half cells at the interface. The flow heats up by q L/(ρ U h c_p) =
# 4 K; the report gives the heat flow through the interface (all of the
# 4000 W/m of the heater in a steady run: the energy balance closes).
#
# The wall conducts ten times better than the fluid (k_s/k_f = 10): heat
# spreads along it towards the inlet, where the cold fluid takes it. Try
#   --set 'materials.wall-solid.conductivity=1.408'     (k_s/k_f = 0.1)
#   --set 'materials.wall-solid.conductivity=1408.0'    (k_s/k_f = 100)

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
upper = [4.0, 1.2, 0.04]
cells = [80, 30, 1]
split = [
  { boundary = "xmin", axis = "y", at = 0.2, name = "inlet" },
  { boundary = "xmax", axis = "y", at = 0.2, name = "outlet" },
]
zones = [{ name = "wall", lower = [0.0, 0.0, 0.0], upper = [4.0, 0.2, 0.04] }]

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 0.01                     # Re = 100
specific_heat = 1000.0
conductivity = 14.084507042253522    # Pr = μ c_p/k = 0.71

[materials.wall-solid]
kind = "solid"
description = "a made-up solid with k_s/k_f = 10 (not a database material)"
density = 2000.0
specific_heat = 800.0
conductivity = 140.84507042253522

[regions.wall]
kind = "solid"
zones = ["wall"]
material = "wall-solid"

[energy]
initial = 300.0

[boundary.inlet]
type = "velocity-inlet"
velocity = [1.0, 0.0, 0.0]
[boundary.inlet.energy]
temperature = 300.0
[boundary.outlet]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymax]
type = "wall"
[boundary.ymin]
type = "wall"
[boundary.ymin.energy]
heat_flux = 1000.0                   # W/m² into the wall
[boundary.xmin]
type = "wall"                        # the upstream end of the wall
[boundary.xmax]
type = "wall"                        # the downstream end of the wall
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-8
max_iterations = 2000

[solver.momentum]
relaxation = 0.9

[solver.energy]
relaxation = 1.0
tolerance = 1e-10
max_iter = 300

[verification]
require_convergence = true

[output]
wall_csv = false
lines = [
  { name = "wall_top", from = [0.025, 0.18, 0.02], to = [3.975, 0.18, 0.02], points = 80 },
  { name = "across", from = [3.0, 0.0, 0.02], to = [3.0, 1.2, 0.02], points = 121 },
]
