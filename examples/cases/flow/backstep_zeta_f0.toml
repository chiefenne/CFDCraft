# Backward-facing step of Driver & Seegmiller (1985), k-ε-ζ-f₀ (Popovac
# 2023) with its compound wall treatment (stage 6 part 6d2, D132, D134,
# specification 9.5).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/backstep_zeta_f0.toml
#
# Step height H = 1 m, inflow 1 m/s, Re_H = 36 000. The wall starts at
# x = −85 H, so that the boundary layer is about 1.5 H thick at
# x = −4 H as in the experiment; the top at 9 H is a slip plane (the
# expansion ratio 1.125 of the experiment), the outlet at 40 H. The
# built-in mesher cuts the step out of the box (`remove`): 125 × 80
# cells less the 50 × 36 under the step, 8 200 cells, graded towards
# the walls, the step corner and the reattachment region (first-cell y⁺
# about 1.5 on the lower wall).
#
# The reattachment length is where the wall shear of `ymin`
# (wall_ymin.csv) changes from negative to positive: x_r/H = 6.44, +3 %
# from the experiment's 6.26 (band ±10 %; 6.38 with the k sink k/T_K of
# 6d2). On 32 800 cells (each interval halved): 6.50. The
# realizability bound of the time scale decides it: with the coefficient
# 0.6 instead of the default 0.6 √2 it halves ν_t in the separated shear
# layer and x_r/H comes out at 7.4 (6d2). The momentum under-relaxation is 0.5 while the bubble forms
# and 0.8 from iteration 100 (`[[schedule]]`): x_r settles to 1 % in
# about 550 iterations, against 950 with 0.5 throughout; 0.9 stalls the
# residual at 10⁻⁴.

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
lower = [-85.0, 0.0, 0.0]
upper = [40.0, 9.0, 0.1]
cells = [125, 80, 1]
segments = { x = [ { to = 0.0, cells = 50, ratio = 0.0136845 }, { to = 40.0, cells = 75, ratio = 15.5955 } ], y = [ { to = 0.5, cells = 18, ratio = 36.8448 }, { to = 1.0, cells = 18, ratio = 0.0271409 }, { to = 9.0, cells = 44, ratio = 367.941 } ] }
remove = [ { lower = [-85.0, 0.0, 0.0], upper = [0.0, 1.0, 0.1], name = "step" } ]

[fluid]
density = 1.0
viscosity = 2.7777777777777777e-5

[turbulence]
model = "k-epsilon-zeta-f0"
wall_treatment = "compound-2023"
ambient = { k = 1.5e-4, epsilon = 7.29e-6 }

[initial]
velocity = [1.0, 0.0, 0.0]
k = 1.0e-3
epsilon = 3.24e-5

[boundary.xmin]
type = "velocity-inlet"
velocity = [1.0, 0.0, 0.0]
k = 1.5e-4
epsilon = 7.29e-6
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymax]
type = "symmetry"
[boundary.ymin]
type = "wall"
[boundary.step]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-6
max_iterations = 1500
log_every = 200

[solver.momentum]
relaxation = 0.5

[[schedule]]
at_iteration = 100
set = { solver.momentum.relaxation = 0.8 }

[verification]
require_convergence = false

[output]
vtkhdf = false
wall_csv = true
wall_probes = [ { name = "x-4", boundary = "step", point = [-4.0, 1.0, 0.05] } ]
reference = { velocity = 1.0 }
