# Turbulent flat plate of the NASA Turbulence Modeling Resource (TMR,
# 2D zero-pressure-gradient case), k-ε-ζ-f₀ (Popovac 2023) with its
# compound wall treatment (stage 6 part 6d2, D132, D134, specification
# 9.3).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/tmr_plate_zeta_f0.toml
#
# The mesh and the free stream of tmr_plate_zeta_f.toml (64 × 48 cells,
# first-cell y⁺ 1 at x = 0.97). Unlike ζ-f, the run starts from the TMR
# free-stream values themselves (ν_t/ν = 0.009): the boundary layer turns
# turbulent on its own, and every field, k included, converges to the
# tolerance (the k sink k/T_K keeps k positive in the laminar part near
# the leading edge, where −ε held k at its floor).
#
# Result: C_f(0.97) = 2.802·10⁻³, −2.5 % from White's correlation
# (2.875·10⁻³; +4.1 % from the TMR value of SST, 2.6907·10⁻³), converged
# in about 630 iterations. First cell at y⁺ 10 / 30: +0.9 % / −2.0 % from
# White, converged in 380 and 240 iterations (ζ-f converges at none of
# the three).

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
lower = [-0.3333333333333333, 0.0, 0.0]
upper = [2.0, 1.0, 1.0]
cells = [64, 48, 1]
grading = { y = { ratio = 17554.734 } }
segments = { x = [ { to = 0.0, cells = 16, ratio = 0.1 }, { to = 2.0, cells = 48, ratio = 20.0 } ] }
split = [ { boundary = "ymin", axis = "x", at = 0.0, name = "plate" } ]

[fluid]
density = 1.0
viscosity = 2.0e-7

[turbulence]
model = "k-epsilon-zeta-f0"
wall_treatment = "compound-2023"
ambient = { k = 2.25e-7, epsilon = 2.53125e-6 }

[initial]
velocity = [1.0, 0.0, 0.0]

[boundary.xmin]
type = "velocity-inlet"
velocity = [1.0, 0.0, 0.0]
k = 2.25e-7
epsilon = 2.53125e-6
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymin]
type = "symmetry"
[boundary.plate]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-7
max_iterations = 4000
log_every = 200

[verification]
require_convergence = true

[output]
vtkhdf = false
wall_csv = true
wall_probes = [ { name = "x097", boundary = "plate", point = [0.970084, 0.0, 0.5] } ]
reference = { velocity = 1.0 }
lines = [ { name = "x097", from = [0.97, 0.0, 0.5], to = [0.97, 0.05, 0.5], points = 400 } ]
