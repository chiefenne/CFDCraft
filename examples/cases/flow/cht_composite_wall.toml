# A composite wall of two solids and a fluid layer at rest: the
# interface conductance of conjugate heat transfer (stage 7d1, D157, check
# V7.4 with conductivity ratios 1 : 100 : 10⁴).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/cht_composite_wall.toml
#
# Three layers along y, 0.4 m each: solid `a` (k = 200 W/(m K)), a closed
# fluid layer (k = 2, at rest: no inflow, walls all round) and solid `b`
# (k = 20 000), between 300 K at the bottom and 400 K at the top. The
# temperature is piecewise linear and the heat flux is the series value
#
#   q = ΔT / Σ tᵢ/kᵢ = 100 / (0.002 + 0.2 + 0.00002) = 495.0005 W/m²,
#
# which the face conductance (δ_P + δ_N)/(δ_P/k_P + δ_N/k_N) reproduces to
# round-off; the report gives it at both walls and at the two interfaces,
# with the interface temperatures 300.990 K and 399.990 K.

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
upper = [1.0, 1.2, 0.05]
cells = [10, 12, 1]
zones = [
  { name = "a", lower = [0.0, 0.0, 0.0], upper = [1.0, 0.4, 0.05] },
  { name = "b", lower = [0.0, 0.8, 0.0], upper = [1.0, 1.2, 0.05] },
]

[fluid]
density = 1.0
viscosity = 0.01
specific_heat = 1000.0
conductivity = 2.0

[materials.slab-a]
kind = "solid"
density = 2000.0
specific_heat = 800.0
conductivity = 200.0

[materials.slab-b]
kind = "solid"
density = 2000.0
specific_heat = 800.0
conductivity = 20000.0

[regions.a]
kind = "solid"
zones = ["a"]
material = "slab-a"

[regions.b]
kind = "solid"
zones = ["b"]
material = "slab-b"

[energy]
initial = 350.0

[boundary.xmin]
type = "wall"
[boundary.xmax]
type = "wall"
[boundary.ymin]
type = "wall"
[boundary.ymin.energy]
temperature = 300.0
[boundary.ymax]
type = "wall"
[boundary.ymax.energy]
temperature = 400.0
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-10
max_iterations = 50

[solver.energy]
relaxation = 1.0
tolerance = 1e-12
max_iter = 500

[output]
wall_csv = false
