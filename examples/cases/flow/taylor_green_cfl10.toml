# Taylor–Green vortex at Courant number 9 with outer correctors (stage 5).
#
#   cargo run --release -p cfdcraft-cli -- flow examples/cases/flow/taylor_green_cfl10.toml
#
# The iterative transient of D28: per time step SIMPLE-type outer iterations
# around the PISO corrections (velocity relaxation 0.9), converged to 1e-9,
# so the time step is limited by accuracy, not by the Courant number. Four
# runs with Δt = 0.16 … 0.02 s (largest Courant number 9.1 … 1.3) to
# t = 0.64 s on 64 x 64 cells; the run fails if the observed time order on
# the smallest steps is outside 1.8–2.2 (stage 5 acceptance: order 2 also at
# CFL 10 with outer correctors converged per step).

[mesh.generate]
type = "hex"
dimension = 2
upper = [1.0, 1.0, 0.015625]
cells = [64, 64, 1]

[fluid]
density = 1.0
viscosity = 0.01         # Re = ρ U L / μ = 100

[flow]
convection = true

# the exact velocity on all four sides, at the time of each step
[boundary.xmin]
type = "velocity-inlet"
profile = "analytic"
[boundary.xmax]
type = "velocity-inlet"
profile = "analytic"
[boundary.ymin]
type = "velocity-inlet"
profile = "analytic"
[boundary.ymax]
type = "velocity-inlet"
profile = "analytic"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[analytic]
type = "taylor-green"    # U = 1 m/s, period L = 1 m

[solver]
outer_iterations = 200
outer_tolerance = 1e-9
relaxation_velocity = 0.9

[time]
scheme = "bdf2"
time_step = 0.16
end_time = 0.64

[verification]
time_steps = [0.16, 0.08, 0.04, 0.02]
expected_time_order = [1.8, 2.2]

[output]
wall_csv = false
