# Heated flat plate, standard k-ε with scalable wall functions and the
# thermal wall function of Kader (stage 6 part 6f, D135, specification 9.3).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/plate_heated_keps.toml
#
# The flat plate of tmr_plate_keps.toml (Re = 5·10⁶ per unit length, plate
# from x = 0 to 2) with an isothermal plate: a passive temperature θ = 1 on
# the plate and 0 in the free stream, Pr = 0.71 (Γ = ν/Pr), constant
# Pr_t = 0.85. The Stanton number St_x = q_w/(U θ_w) comes from the wall
# file (wall_plate.csv: `theta_flux`) and is compared with the correlation
# of Kays, Crawford & Weigand (2005), St = 0.0287 Re_x^−0.2 Pr^−0.4
# (band ±10 %); the verification page lists the result.

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
lower = [-0.3333333333333333, 0.0, 0.0]
upper = [2.0, 1.0, 1.0]
cells = [64, 48, 1]
grading = { y = { ratio = 361.051 } }
segments = { x = [ { to = 0.0, cells = 16, ratio = 0.1 }, { to = 2.0, cells = 48, ratio = 20.0 } ] }
split = [ { boundary = "ymin", axis = "x", at = 0.0, name = "plate" } ]

[fluid]
density = 1.0
viscosity = 2.0e-7

[turbulence]
model = "k-epsilon"
wall_treatment = "scalable"
ambient = { k = 2.25e-7, epsilon = 2.53125e-6 }

[scalars.theta]
diffusivity = 2.8169014084507043e-7   # ν/Pr, Pr = 0.71
initial = 0.0
turbulent_prandtl = 0.85
wall_function = "kader"

[initial]
velocity = [1.0, 0.0, 0.0]
k = 2.25e-7
epsilon = 2.53125e-6

[boundary.xmin]
type = "velocity-inlet"
velocity = [1.0, 0.0, 0.0]
k = 2.25e-7
epsilon = 2.53125e-6
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymin]
type = "symmetry"
[boundary.plate]
type = "wall"
[boundary.plate.scalar.theta]
value = 1.0
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-7
max_iterations = 3000
log_every = 200

[verification]
require_convergence = true

[output]
vtkhdf = false
wall_csv = true
wall_probes = [ { name = "x097", boundary = "plate", point = [0.970084, 0.0, 0.5] } ]
reference = { velocity = 1.0 }
lines = [ { name = "x097", from = [0.97, 0.0, 0.5], to = [0.97, 0.05, 0.5], points = 400 } ]
