# Periodic plane Poiseuille flow driven by the mass flow (stage 6 part 6p,
# D29): the channel of poiseuille_hex.toml with its inlet and outlet as one
# translational periodic pair.
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/poiseuille_periodic.toml
#
# Channel 0 < y < 1 (h = 1 m) of length 2 m between walls at rest, depth
# 0.1 m, Re = ρ U h / μ = 10. The boundaries xmin and xmax are a periodic
# pair; the mass flow 0.1 kg/s (mean velocity U = 1 m/s) through it is held
# by a uniform body force along x that the solver adjusts after every
# pressure correction. It converges to the mean pressure gradient of the
# open channel, 12 μ U / h² = 1.2 Pa/m, and the profile to the exact
# parabola. Three nested meshes; the observed order of the velocity error
# must lie in 1.8–2.2, as for the open channel (D27).

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
upper = [2.0, 1.0, 0.1]
cells = [32, 16, 1]
perturb = 0.15

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 0.1

[boundary.xmin]
type = "periodic"
partner = "xmax"
mass_flow = 0.1          # kg/s from xmin towards xmax
[boundary.xmax]
type = "periodic"
[boundary.ymin]
type = "wall"
[boundary.ymax]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-9
max_iterations = 5000

[solver.momentum]
relaxation = 0.9

[analytic]
type = "poiseuille"
mean_velocity = 1.0
x_outlet = 2.0

[verification]
levels = [0, 1, 2]
expected_order = [1.8, 2.2]
require_convergence = true

[output]
vtkhdf = false
wall_csv = false
