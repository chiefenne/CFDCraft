# Plane Poiseuille flow on poly cells: order-of-accuracy sweep (stage 4).
#
#   cargo run --release -p cfdcraft-cli -- flow examples/cases/flow/poiseuille_poly.toml
#
# Channel 0 < y < 1 of length 2 between walls at rest, the exact parabolic
# profile (mean velocity 1 m/s) at the inlet, a static pressure outlet,
# Re = ρ U h / μ = 10. Three nested meshes (32 x 16, 64 x 32, 128 x 64
# cells); the run fails if the observed order of the velocity error on the
# finest pair is outside 1.8–2.2 (D27 acceptance).

[mesh.generate]
type = "poly"
dimension = 2
upper = [2.0, 1.0, 0.1]
cells = [32, 16, 1]
perturb = 0.15         # random node displacement, fraction of the interval

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 0.1

[boundary.xmin]
type = "velocity-inlet"
profile = "analytic"     # the exact parabola
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymin]
type = "wall"
[boundary.ymax]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
relaxation_velocity = 0.9
tolerance = 1e-9
max_iterations = 5000

[analytic]
type = "poiseuille"
mean_velocity = 1.0
x_outlet = 2.0

[verification]
levels = [0, 1, 2]
expected_order = [1.8, 2.2]
require_convergence = true

[output]
vtkhdf = false
wall_csv = false
