# Turbulent flat plate of the NASA Turbulence Modeling Resource (TMR,
# 2D zero-pressure-gradient case), k-ε-ζ-f with the compound wall
# treatment (stage 6 part 6d, D132, D134, specification 9.3).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/tmr_plate_zeta_f.toml
#
# The geometry and the free stream of tmr_plate_keps.toml (Re = 5·10⁶ per
# metre, k = 2.25·10⁻⁷ U², ε = 2.53125·10⁻⁶ m²/s³ held by the sustaining
# terms), on 64 × 48 cells graded so that the first-cell y⁺ at x = 0.97
# is 1: the compound treatment integrates to the wall there.
#
# The start: from the free-stream values (ν_t/ν = 0.009) ζ-f keeps the
# boundary layer laminar over the whole plate (C_f = 3.0·10⁻⁴, Blasius):
# its length scale L ≥ C_L C_η (ν³/ε)^¼ of the weak free stream is larger
# than the laminar layer, and f drives ζ, and with it ν_t, to zero across
# it. The case therefore starts from a turbulent field (k = 10⁻⁴,
# ε = 4.5·10⁻⁵, ν_t/ν = 10); the inlet keeps the TMR values.
#
# Result: C_f(0.97) = 2.931·10⁻³, +2.0 % from White's correlation
# (2.875·10⁻³; band ±3 %), converged in about 1 400 iterations; on
# 128 × 96 cells 2.876·10⁻³ (+0.03 %). The sink of k is max(k/T_K,
# 2νk/d²) (`turbulence.k_sink`, docs/requirements/stage6-turbulence.md
# 3.3.2): in the laminar part near the leading edge the published sink −ε
# has no positive steady solution once T sits at its Kolmogorov bound,
# and the positivity floor held k there with its residual at 7·10⁻⁶
# (TURB002); `k_sink = "epsilon"` shows that.

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
lower = [-0.3333333333333333, 0.0, 0.0]
upper = [2.0, 1.0, 1.0]
cells = [64, 48, 1]
grading = { y = { ratio = 17554.734 } }
segments = { x = [ { to = 0.0, cells = 16, ratio = 0.1 }, { to = 2.0, cells = 48, ratio = 20.0 } ] }
split = [ { boundary = "ymin", axis = "x", at = 0.0, name = "plate" } ]

[fluid]
density = 1.0
viscosity = 2.0e-7

[turbulence]
model = "k-epsilon-zeta-f"
wall_treatment = "compound"
ambient = { k = 2.25e-7, epsilon = 2.53125e-6 }

[initial]
velocity = [1.0, 0.0, 0.0]
k = 1.0e-4                # a turbulent start (see above)
epsilon = 4.5e-5

[boundary.xmin]
type = "velocity-inlet"
velocity = [1.0, 0.0, 0.0]
k = 2.25e-7
epsilon = 2.53125e-6
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymin]
type = "symmetry"
[boundary.plate]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-7
max_iterations = 4000
log_every = 200

[verification]
require_convergence = true

[output]
vtkhdf = false
wall_csv = true
wall_probes = [ { name = "x097", boundary = "plate", point = [0.970084, 0.0, 0.5] } ]
reference = { velocity = 1.0 }
lines = [ { name = "x097", from = [0.97, 0.0, 0.5], to = [0.97, 0.05, 0.5], points = 400 } ]
