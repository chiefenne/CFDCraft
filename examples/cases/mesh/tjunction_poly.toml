# T-junction mixer from Gmsh (examples/meshes/tjunction.geo), converted into polyhedra (one cell per node of the tetrahedral mesh),
# renumbered by reverse Cuthill-McKee, split into 4 parts. Gallery example 6.
#
#   gmsh -3 examples/meshes/tjunction.geo -format msh41 -o examples/meshes/tjunction.msh
#   foehn mesh examples/cases/mesh/tjunction_poly.toml

case_format = "0.6"

[mesh]
file = "../../meshes/tjunction.msh"   # relative to this case file
scale = 1.0                           # 0.001 for a mesh in millimetres
polyhedral = true                     # tetrahedra -> polyhedra
renumber = "rcm"                      # none | rcm | shuffle

[partition]
parts = 4
method = "metis"

[check]
locate_points = 5000
