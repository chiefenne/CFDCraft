# poly 2D mesh: one cell layer thick in z (D3), clustered towards the
# walls y = 0 and y = 1 and towards x = 0, nodes perturbed in x and y.
# The patches zmin and zmax take the symmetry condition in a 2D case.
# Gallery example 5.
#
#   ennecraft mesh examples/cases/mesh/poly_2d.toml

[mesh.generate]
type = "poly"
dimension = 2
lower = [0.0, 0.0, 0.0]
upper = [2.0, 1.0, 0.1]
cells = [16, 10, 1]
grading.x = { ratio = 3.0 }                     # last / first interval
grading.y = { ratio = 4.0, symmetric = true }   # middle / wall interval
perturb = 0.1
seed = 2026

[mesh.patches]          # rename the generator's patches
xmin = "inlet"
xmax = "outlet"
ymin = "bottom"
ymax = "top"
zmin = "back"
zmax = "front"
