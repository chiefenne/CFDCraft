# mixed 2D mesh: one cell layer thick in z (D3), clustered towards the
# walls y = 0 and y = 1 and towards x = 0, nodes perturbed in x and y.
# The boundaries zmin and zmax take the symmetry condition in a 2D case.
# Gallery example 5.
#
#   foehn mesh examples/cases/mesh/mixed_2d.toml

case_format = "0.6"

[mesh.generate]
type = "mixed"
dimension = 2
lower = [0.0, 0.0, 0.0]
upper = [2.0, 1.0, 0.1]
cells = [16, 10, 1]
grading.x = { ratio = 3.0 }                     # last / first interval
grading.y = { ratio = 4.0, symmetric = true }   # middle / wall interval
perturb = 0.1
seed = 2026

[mesh.boundaries]          # rename the generator's boundaries
xmin = "inlet"
xmax = "outlet"
ymin = "bottom"
ymax = "top"
zmin = "back"
zmax = "front"
