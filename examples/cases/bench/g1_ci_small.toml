# G1 smoke case for continuous integration: a small mesh, all CPU backends,
# all kernels. Checks that the harness runs and that every backend gives the
# reference results bitwise; the timings of a shared CI runner mean little.
#
#   foehn bench g1 examples/cases/bench/g1_ci_small.toml

[mesh]
cells = 200_000        # near-cubic periodic box, 58 x 58 x 59
ordering = "shuffled"  # worst-case memory access, also exercises the SELL permutation

[run]
backends = ["cpu-serial", "cpu-threads", "cpu-native"]
repeat = 3
warmup = 1

[sell]
chunk = 32
sigma = 64

[output]
directory = "output/g1_ci_small"
name = "g1"
