# G1 on the CPU on a polyhedral mesh (stage 1): the dual of a tetrahedral
# mesh of the unit cube, about 2 million cells with 14 faces per interior
# cell, in the generator's order. The stricter rerun of G1 named in
# docs/benchmarks/g1.md: uneven rows, twice the faces per cell of the
# hexahedral box.
#
#   inncraft bench g1 examples/cases/bench/g1_cpu_poly_2m.toml
#
# Needs about 3 GB of memory (the generator dominates).

[mesh]
type = "poly"          # periodic-box | hex | tet | poly | mixed
cells = 2_000_000
ordering = "natural"

[run]
backends = ["cpu-threads", "cpu-native"]
repeat = 10
warmup = 2

[output]
directory = "output/g1_cpu_poly_2m"
name = "g1"
