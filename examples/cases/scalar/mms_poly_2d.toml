# Convection–diffusion with a manufactured solution on 2D polygonal meshes
# (one cell thick, D3): order-of-accuracy sweep over four nested
# refinements (stage 2).
#
#   cargo run --release -p foehncraft-cli -- scalar examples/cases/scalar/mms_poly_2d.toml
#
# The planar solution φ = 1 + sin(πx + 0.5) cos(πy + 0.3) does not depend on
# z; the two z patches take the zero-gradient (symmetry) condition, which
# enters the least-squares gradient as a stencil point on the face normal.

[mesh.generate]
type = "poly"          # prisms on the dual polygons of a triangulation
dimension = 2
cells = [4, 4, 1]
perturb = 0.15

[mesh]
renumber = "rcm"

[problem]
diffusivity = 0.2
velocity = [1.0, 0.6, 0.0]
manufactured = { wavenumber = [3.141592653589793, 3.141592653589793, 0.0], phase = [0.5, 0.3, 0.0] }

[problem.boundary.xmin]
type = "fixed-value"
profile = "manufactured"
[problem.boundary.xmax]
type = "fixed-value"
profile = "manufactured"
[problem.boundary.ymin]
type = "fixed-value"
profile = "manufactured"
[problem.boundary.ymax]
type = "fixed-value"
profile = "manufactured"
[problem.boundary.zmin]
type = "zero-gradient"
[problem.boundary.zmax]
type = "zero-gradient"

[solver]
scheme = "linear-upwind"

[verification]
levels = [2, 3, 4, 5]
expected_order = [1.8, 2.2]
