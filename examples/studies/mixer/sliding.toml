# The baffled stirred vessel of mrf.toml with the sliding mesh by
# imprinting (D182 variant B): the rotor mesh (64 intervals on the interface
# circle) turns through the stator mesh (96 intervals), transient, from rest.
# A lower viscosity than the steady MRF case (Reynolds number
# omega R_tip^2 / nu = 400): the blades shed start-up vortices that the
# baffles break up.
#
#   pip install gmsh
#   python3 examples/meshes/mixer.py
#   cargo run --release -p foehncraft-cli -- flow examples/studies/mixer/sliding.toml
#
# Three revolutions in 1 508 steps take about seven minutes on four cores.

case_format = "0.6"

[mesh]
file = "../../meshes/mixer_split.msh"
renumber = "rcm"

[fluid]
density = 1000.0
viscosity = 0.05          # Pa s: nu = 5e-5 m^2/s

[constants]
spin = 10.0

[flow]
convection = true

[time]
scheme = "bdf2"
time_step = 0.00125
steps = 1508              # three revolutions (2 pi / 10 rad/s each)
start_time = 0.0

[[sliding]]
zone = "rotor"
axis = [0.0, 0.0, 1.0]
omega = 10.0
rotor_interface = "rotor_interface"
stator_interface = "stator_interface"

[boundary.blades]
type = "wall"
velocity = ["-spin * y", "spin * x", 0.0]
[boundary.vessel]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-8
max_iterations = 3000
extrapolation = false
outer_iterations = 4

[output]
vtkhdf = true
wall_csv = false
derived = ["vorticity"]
fields_times = [0.15, 0.3, 0.6, 1.2]
