# Backward-facing step of Driver & Seegmiller (1985), Re_H = 36 000, with
# k-ε-ζ-f₀ (compound-2023): the case flow/backstep_zeta_f0.toml on the fine mesh (each
# interval halved, 32 800 cells) with field output and velocity profiles
# at x/H = 1, 4, 6, 10, for the model comparison of gallery 74;
# 3 000 iterations with the relaxation schedule below.
#
#   target/release/foehn flow examples/studies/backstep/zf0.toml --out output/backstep_zeta_f0
#   python3 -m tools.plot.backstep_chart docs/figures/gallery/backstep \
#       "k-ε (scalable)=output/backstep_keps" "k-ε-ζ-f₀=output/backstep_zeta_f0" "k-ω SST=output/backstep_sst"

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
lower = [-85.0, 0.0, 0.0]
upper = [40.0, 9.0, 0.1]
cells = [250, 160, 1]
segments = { x = [ { to = 0.0, cells = 100, ratio = 0.0136845 }, { to = 40.0, cells = 150, ratio = 15.5955 } ], y = [ { to = 0.5, cells = 35, ratio = 36.8448 }, { to = 1.0, cells = 35, ratio = 0.0271409 }, { to = 9.0, cells = 90, ratio = 367.941 } ] }
remove = [ { lower = [-85.0, 0.0, 0.0], upper = [0.0, 1.0, 0.1], name = "step" } ]

[fluid]
density = 1.0
viscosity = 2.7777777777777777e-5

[turbulence]
model = "k-epsilon-zeta-f0"
wall_treatment = "compound-2023"
ambient = { k = 1.5e-4, epsilon = 7.29e-6 }

[initial]
velocity = [1.0, 0.0, 0.0]
k = 1.0e-3
epsilon = 3.24e-5

[boundary.xmin]
type = "velocity-inlet"
velocity = [1.0, 0.0, 0.0]
k = 1.5e-4
epsilon = 7.29e-6
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymax]
type = "symmetry"
[boundary.ymin]
type = "wall"
[boundary.step]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-6
max_iterations = 3000
log_every = 200

[solver.momentum]
relaxation = 0.5

# 0.5 while the bubble forms, 0.8 from iteration 100: x_r settles to 1 %
# in about 1 750 iterations on this mesh, against about 2 900 (ζ-f₀) and
# more than 4 000 (SST) with 0.5 throughout (verification, stage 6d2)
[[schedule]]
at_iteration = 100
set = { solver.momentum.relaxation = 0.8 }

[verification]
require_convergence = false

[output]
vtkhdf = true
wall_csv = true
lines = [ { name = "x1", from = [1.0, 0.0, 0.05], to = [1.0, 3.0, 0.05], points = 200 }, { name = "x4", from = [4.0, 0.0, 0.05], to = [4.0, 3.0, 0.05], points = 200 }, { name = "x6", from = [6.0, 0.0, 0.05], to = [6.0, 3.0, 0.05], points = 200 }, { name = "x10", from = [10.0, 0.0, 0.05], to = [10.0, 3.0, 0.05], points = 200 } ]
wall_probes = [ { name = "x-4", boundary = "step", point = [-4.0, 1.0, 0.05] } ]
reference = { velocity = 1.0 }
