[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "foehncraft"
description = "Python API of the Foehncraft CFD solver: cases, expressions, runs, results and studies (D61)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Andreas Ennemoser" }]
dynamic = ["version"]
dependencies = [
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# reading the fields of VTKHDF and restart files
fields = ["h5py>=3.8", "numpy>=1.24"]
# Latin hypercube and Sobol samples of the study layer
study = ["scipy>=1.10"]
test = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/chiefenne/Foehncraft"

[tool.maturin]
manifest-path = "../crates/foehncraft-py/Cargo.toml"
module-name = "foehncraft._native"
python-source = "."
features = ["extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip() without strict= (Python 3.10 has it, but the lengths are known)

[tool.pytest.ini_options]
testpaths = ["tests"]
