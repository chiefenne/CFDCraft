# Regenerates the number tables of docs/gallery.md and docs/recipes.md after
# a merge to main (tools/docs/indexes.py). Pull requests add entries only to
# the topic pages and leave the index pages alone, so that parallel pull
# requests do not conflict on them. Commits with the workflow token do not
# start another CI run.
name: Docs indexes

on:
  push:
    branches: [main]
    paths:
      - "docs/gallery/**"
      - "docs/recipes/**"
      - "docs/gallery.md"
      - "docs/recipes.md"
      - "tools/docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-index
  cancel-in-progress: false

jobs:
  indexes:
    name: Regenerate the gallery and recipe indexes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 -m tools.docs.indexes
      - name: Commit when changed
        run: |
          if git diff --quiet; then echo "indexes current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: regenerate the gallery and recipe indexes"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((i * 5))
            git pull --rebase origin main
            python3 -m tools.docs.indexes
            git diff --quiet || git commit -am "docs: regenerate the gallery and recipe indexes"
          done
          exit 1
