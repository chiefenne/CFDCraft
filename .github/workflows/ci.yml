# Continuous integration (D22): CPU build and tests on GitHub's free hosted
# runners, on every pull request and every push to main. GPU tests run on
# the maintainer's machine and are not part of these checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      # the CUDA backends compile without a CUDA toolkit (driver and NVRTC
      # are loaded at run time)
      - run: cargo clippy --workspace --all-targets --locked --features foehncraft-bench/cuda,foehncraft-fv/cuda
      - run: cargo doc --workspace --no-deps --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release
      - name: G1 smoke run (CPU backends, results bitwise equal)
        run: cargo run --release --locked -p foehncraft-cli -- bench g1 examples/cases/bench/g1_ci_small.toml
      - name: Mesh cases (generated meshes, quality report, VTKHDF)
        shell: bash
        run: |
          for f in examples/cases/mesh/*_box.toml examples/cases/mesh/*_2d.toml examples/cases/mesh/poly_partition.toml; do
            cargo run --release --locked -p foehncraft-cli -- mesh "$f"
          done
      - name: Scalar cases of the gallery and the case catalogue (R5; each checks its own results)
        shell: bash
        run: |
          for f in examples/cases/scalar/*.toml; do
            case "$f" in *_gpu.toml) continue;; esac
            cargo run --release --locked -p foehncraft-cli -- scalar "$f"
          done
      - name: Poisson studies of the pressure solver (stage 3; each checks its own results)
        shell: bash
        run: |
          for f in examples/cases/poisson/*.toml; do
            case "$f" in *_gpu.toml) continue;; esac
            cargo run --release --locked -p foehncraft-cli -- poisson "$f"
          done
      - name: Flow cases (stages 4 and 5; each checks its own results; all on Linux, the quick ones elsewhere)
        shell: bash
        run: |
          for f in examples/cases/flow/*.toml; do
            if [ "$RUNNER_OS" != "Linux" ]; then
              case "$f" in *couette_*|*cavity_re100.toml|*cavity_re100_poly3d.toml|*poiseuille_hex.toml|*poiseuille_poly.toml|*taylor_green_space.toml) ;; *) continue;; esac
            fi
            cargo run --release --locked -p foehncraft-cli -- flow "$f"
          done
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: VTKHDF files load with VTK's reader (the reader of ParaView)
        if: runner.os == 'Linux'
        run: |
          pip install vtk numpy
          python3 tools/check_vtkhdf.py output/*/mesh.vtkhdf output/*/fields.vtkhdf output/*/*/fields.vtkhdf
      - name: Without HDF5 and METIS
        if: runner.os == 'Linux'
        run: |
          cargo test -p foehncraft-mesh --no-default-features --locked
          cargo test -p foehncraft-fv --no-default-features --locked
          cargo test -p foehncraft-flow --no-default-features --locked
      - uses: actions/upload-artifact@v4
        with:
          name: g1-ci-small-${{ matrix.os }}
          path: output/g1_ci_small/
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-reports-${{ matrix.os }}
          path: output/*/mesh_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: scalar-reports-${{ matrix.os }}
          path: |
            output/*/scalar.md
            output/*/*.svg
      - uses: actions/upload-artifact@v4
        with:
          name: poisson-reports-${{ matrix.os }}
          path: |
            output/poisson_*/poisson.md
            output/poisson_*/iterations.svg
      - uses: actions/upload-artifact@v4
        with:
          name: flow-reports-${{ matrix.os }}
          path: |
            output/couette_*/flow.md
            output/poiseuille_*/flow.md
            output/poiseuille_*/convergence.svg
            output/cavity_*/flow.md
            output/cavity_*/*.svg
            output/taylor_green_*/flow.md
            output/cylinder_*/flow.md
            output/cylinder_*/*.svg

  hypre:
    name: Pressure solver against hypre (D20)
    runs-on: ubuntu-latest
    env:
      HYPRE_DIR: ${{ github.workspace }}/hypre-install
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache the hypre build
        id: hypre-cache
        uses: actions/cache@v4
        with:
          path: hypre-install
          key: hypre-v3.2.1-${{ runner.os }}-${{ hashFiles('tools/build_hypre.sh') }}
      - name: Build hypre (sequential, shared)
        if: steps.hypre-cache.outputs.cache-hit != 'true'
        run: tools/build_hypre.sh "$HYPRE_DIR"
      - run: cargo clippy -p foehncraft-fv -p foehncraft-cli --all-targets --locked --features foehncraft-fv/hypre,foehncraft-cli/hypre
      - name: Stage-3 tests including the agreement with hypre
        run: cargo test --release --locked -p foehncraft-fv --features hypre --test stage3
      - name: Poisson studies with hypre as the reference
        shell: bash
        run: |
          cargo build --release --locked -p foehncraft-cli --features hypre
          for f in examples/cases/poisson/*_box.toml; do
            n=$(basename "$f" .toml)
            target/release/foehn poisson "$f" --solvers amg,amg-double,jacobi,hypre \
              --backends cpu,cpu-serial --out "output/${n}_hypre"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: poisson-hypre-reports
          path: |
            output/*_hypre/poisson.md
            output/*_hypre/iterations.svg

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  mpi:
    name: MPI, 4 ranks on one machine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Open MPI (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libclang-dev
      - name: Install Open MPI (macOS)
        if: runner.os == 'macOS'
        run: brew install open-mpi
      - run: cargo test -p foehncraft-parallel --features mpi --locked
      - run: cargo build --release -p foehncraft-parallel --features mpi --example mpi_smoke --locked
      - name: Run with 4 ranks
        run: mpirun --oversubscribe -n 4 target/release/examples/mpi_smoke
      - name: Run with 2 ranks
        run: mpirun --oversubscribe -n 2 target/release/examples/mpi_smoke
      - run: cargo build --release -p foehncraft-mesh --features mpi --example mpi_halo --locked
      - name: Halo exchange of a partitioned mesh, 4 and 2 ranks
        run: |
          mpirun --oversubscribe -n 4 target/release/examples/mpi_halo
          mpirun --oversubscribe -n 2 target/release/examples/mpi_halo

  ptx:
    name: Single-source GPU kernels compile to PTX (G1, stages 2 and 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads gpu/ptx-kernels/rust-toolchain.toml and installs nightly
      # with the nvptx64-nvidia-cuda target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpu/ptx-kernels -> ../../target
      - run: gpu/ptx-kernels/build.sh
      - name: No atomics, no f32, no contracted f64 arithmetic in the kernels (R10)
        run: tools/check_kernels.sh
      - run: gpu/ptx-kernels/build.sh sm_86
      - uses: actions/upload-artifact@v4
        with:
          name: g1-ptx
          path: target/nvptx64-nvidia-cuda/release/foehncraft_ptx_kernels.ptx
