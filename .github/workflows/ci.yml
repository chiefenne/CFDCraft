# Continuous integration (D22): CPU build and tests on GitHub's free hosted
# runners. GPU tests run on the maintainer's machine and are not part of
# these checks.
#
# Two tiers, one workflow:
#   fast PR gate   pull requests: everything except the long cases, built
#                  with the `ci` profile (release optimisation, no LTO, 16
#                  codegen units), test cases sharded over parallel jobs.
#                  Target: under 5 minutes with a warm cache.
#   full tier      push to main, the nightly schedule, workflow_dispatch, and
#                  pull requests with the label `full-ci`: the shipped
#                  `release` profile, every case on every platform, the long
#                  cases, and the tests marked slow.
# The bitwise-reproducibility tests (thread counts, AMG, G1 backends) are in
# both tiers.
#
# Branch protection needs only one required check: "CI OK" (last job).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # nightly on main: 01:07 UTC = 02:07 in Vienna in winter (03:07 in
    # summer); GitHub cron is UTC only, and minute 7 avoids the top-of-hour
    # queue of scheduled runs
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (a new push cancels the old run); runs on main are never
# cancelled, so every merge commit is verified.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash everywhere, also on Windows (Git Bash), so that "$BUILD_PROFILE" means
# the same in every step
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------
  # Decides what this run does: skip code jobs for docs-only changes, pick
  # the tier, the build profile and the case shards.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
      full: ${{ steps.tier.outputs.full }}
      profile: ${{ steps.tier.outputs.profile }}
      cases: ${{ steps.tier.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # "code" is everything that can change a build or a result; a PR
          # that only touches docs/, *.md, assets/ or LICENSE skips the
          # code jobs (CI OK still reports, so the PR can be merged).
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!assets/**'
              - '!LICENSE'
      - id: tier
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "full=true"         >> "$GITHUB_OUTPUT"
            echo "profile=release"   >> "$GITHUB_OUTPUT"
            echo 'cases=[{"os":"ubuntu-latest","set":"linux-1"},{"os":"ubuntu-latest","set":"linux-2"},{"os":"ubuntu-latest","set":"linux-3"},{"os":"ubuntu-latest","set":"long"},{"os":"macos-latest","set":"quick"},{"os":"windows-latest","set":"quick"}]' >> "$GITHUB_OUTPUT"
          else
            echo "full=false"        >> "$GITHUB_OUTPUT"
            echo "profile=ci"        >> "$GITHUB_OUTPUT"
            echo 'cases=[{"os":"ubuntu-latest","set":"linux-1"},{"os":"ubuntu-latest","set":"linux-2"},{"os":"ubuntu-latest","set":"linux-3"},{"os":"macos-latest","set":"quick"},{"os":"windows-latest","set":"quick"}]' >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  lint:
    name: Format, clippy, docs
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs restore main's cache but never write their own: the 10 GB
          # repository cache stays warm instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - name: Every flow case is in a CI case set
        run: tools/ci_cases.sh --check
      - run: cargo clippy --workspace --all-targets --locked
      # the CUDA backends compile without a CUDA toolkit (driver and NVRTC
      # are loaded at run time)
      - run: cargo clippy --workspace --all-targets --locked --features foehncraft-cuda/cuda,foehncraft-cli/cuda
      - name: CUDA only in the CUDA backend crate (D60)
        run: python3 tools/check_backend.py
      - run: cargo doc --workspace --no-deps --locked

  msrv:
    name: Minimum Rust version
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  # ---------------------------------------------------------------------
  # Unit and integration tests, including every bitwise-reproducibility
  # test, and the G1 smoke run (all CPU backends bitwise equal).
  test:
    name: Test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      BUILD_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ needs.plan.outputs.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # debug build: debug assertions and overflow checks (full tier only;
      # the PR gate relies on the optimised run below)
      - if: needs.plan.outputs.full == 'true'
        run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --profile "$BUILD_PROFILE"
      - name: Slow tests (marked #[ignore]; nightly only)
        if: github.event_name == 'schedule'
        run: cargo test --workspace --locked --profile "$BUILD_PROFILE" -- --ignored
      - name: G1 smoke run (CPU backends, results bitwise equal)
        run: cargo run --locked --profile "$BUILD_PROFILE" -p foehncraft-cli -- bench g1 examples/cases/bench/g1_ci_small.toml
      - name: Without HDF5 and METIS
        if: runner.os == 'Linux'
        run: |
          cargo test -p foehncraft-mesh --no-default-features --locked
          cargo test -p foehncraft-fv --no-default-features --locked
          cargo test -p foehncraft-flow --no-default-features --locked
          tools/check_c_free.sh
      - uses: actions/upload-artifact@v4
        with:
          name: g1-ci-small-${{ matrix.os }}
          path: output/g1_ci_small/

  # ---------------------------------------------------------------------
  # The case catalogue (R5; each case checks its own results), sharded.
  # The lists live in tools/ci_cases.sh so that CI and recipe 5 run the
  # same cases.
  cases:
    name: Cases ${{ matrix.set }} (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    env:
      BUILD_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # all shards of one OS share one cache entry (same binary)
          shared-key: cases-${{ needs.plan.outputs.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.set != 'long' }}
      - run: cargo build --locked --profile "$BUILD_PROFILE" -p foehncraft-cli
      - name: Run the cases of set ${{ matrix.set }}
        shell: bash
        run: tools/ci_cases.sh "${{ matrix.set }}" "target/$BUILD_PROFILE/foehn"
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - name: VTKHDF files load with VTK's reader (the reader of ParaView)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install -r tools/requirements-ci.txt
          shopt -s nullglob
          files=(output/*/mesh.vtkhdf output/*/fields.vtkhdf output/*/*/fields.vtkhdf)
          if [ ${#files[@]} -gt 0 ]; then python3 tools/check_vtkhdf.py "${files[@]}"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-reports-${{ matrix.set }}-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            output/*/mesh_report.md
            output/*/scalar.md
            output/*/poisson.md
            output/*/flow.md
            output/*/*.svg
            output/*/*/*.svg
            output/*/convergence.svg

  # ---------------------------------------------------------------------
  hypre:
    name: Pressure solver against hypre (D20)
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      HYPRE_DIR: ${{ github.workspace }}/hypre-install
      BUILD_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ needs.plan.outputs.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the hypre build
        id: hypre-cache
        uses: actions/cache@v4
        with:
          path: hypre-install
          key: hypre-v3.2.1-${{ runner.os }}-${{ hashFiles('tools/build_hypre.sh') }}
      - name: Build hypre (sequential, shared)
        if: steps.hypre-cache.outputs.cache-hit != 'true'
        run: tools/build_hypre.sh "$HYPRE_DIR"
      - run: cargo clippy -p foehncraft-fv -p foehncraft-cli --all-targets --locked --features foehncraft-fv/hypre,foehncraft-cli/hypre
      - name: Stage-3 tests including the agreement with hypre
        run: cargo test --locked --profile "$BUILD_PROFILE" -p foehncraft-fv --features hypre --test stage3
      - name: Poisson studies with hypre as the reference
        shell: bash
        run: |
          cargo build --locked --profile "$BUILD_PROFILE" -p foehncraft-cli --features hypre
          for f in examples/cases/poisson/*_box.toml; do
            n=$(basename "$f" .toml)
            "target/$BUILD_PROFILE/foehn" poisson "$f" --solvers amg,amg-double,jacobi,hypre \
              --backends cpu,cpu-serial --out "output/${n}_hypre"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: poisson-hypre-reports
          path: |
            output/*_hypre/poisson.md
            output/*_hypre/iterations.svg

  # ---------------------------------------------------------------------
  mpi:
    name: MPI, 4 ranks on one machine (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Open MPI (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libclang-dev
      - name: Install Open MPI (macOS)
        if: runner.os == 'macOS'
        run: brew install open-mpi
      - run: cargo test -p foehncraft-parallel --features mpi --locked
      - run: cargo build --release -p foehncraft-parallel --features mpi --example mpi_smoke --locked
      - name: Run with 4 ranks
        run: mpirun --oversubscribe -n 4 target/release/examples/mpi_smoke
      - name: Run with 2 ranks
        run: mpirun --oversubscribe -n 2 target/release/examples/mpi_smoke
      - run: cargo build --release -p foehncraft-mesh --features mpi --example mpi_halo --locked
      - name: Halo exchange of a partitioned mesh, 4 and 2 ranks
        run: |
          mpirun --oversubscribe -n 4 target/release/examples/mpi_halo
          mpirun --oversubscribe -n 2 target/release/examples/mpi_halo

  ptx:
    name: Single-source GPU kernels compile to PTX (G1, stages 2, 3 and 5)
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads gpu/ptx-kernels/rust-toolchain.toml and installs nightly
      # with the nvptx64-nvidia-cuda target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpu/ptx-kernels -> ../../target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: gpu/ptx-kernels/build.sh
      - name: No atomics, no f32, no contracted f64 arithmetic in the kernels (R10)
        run: tools/check_kernels.sh
      - run: gpu/ptx-kernels/build.sh sm_86
      - uses: actions/upload-artifact@v4
        with:
          name: g1-ptx
          path: target/nvptx64-nvidia-cuda/release/foehncraft_ptx_kernels.ptx

  # ---------------------------------------------------------------------
  # The single required check. Green when every job above passed or was
  # skipped on purpose (docs-only PR); red when any failed or was cancelled.
  ci-ok:
    name: CI OK
    if: always()
    needs: [plan, lint, msrv, test, cases, hypre, mpi, ptx]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1;; esac
          done
