# Continuous integration (D22): CPU build and tests on GitHub's free hosted
# runners, on every pull request and every push to main. GPU tests run on
# the maintainer's machine and are not part of these checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      # the CUDA backends compile without a CUDA toolkit (driver and NVRTC
      # are loaded at run time)
      - run: cargo clippy --workspace --all-targets --locked --features cfdcraft-bench/cuda,cfdcraft-fv/cuda
      - run: cargo doc --workspace --no-deps --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release
      - name: G1 smoke run (CPU backends, results bitwise equal)
        run: cargo run --release --locked -p cfdcraft-cli -- bench g1 examples/cases/bench/g1_ci_small.toml
      - name: Mesh cases (generated meshes, quality report, VTKHDF)
        shell: bash
        run: |
          for f in examples/cases/mesh/*_box.toml examples/cases/mesh/*_2d.toml examples/cases/mesh/poly_partition.toml; do
            cargo run --release --locked -p cfdcraft-cli -- mesh "$f"
          done
      - name: Scalar cases of the gallery and the case catalogue (R5; each checks its own results)
        shell: bash
        run: |
          for f in examples/cases/scalar/*.toml; do
            case "$f" in *_gpu.toml) continue;; esac
            cargo run --release --locked -p cfdcraft-cli -- scalar "$f"
          done
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: VTKHDF files load with VTK's reader (the reader of ParaView)
        if: runner.os == 'Linux'
        run: |
          pip install vtk numpy
          python3 tools/check_vtkhdf.py output/*/mesh.vtkhdf output/*/fields.vtkhdf output/*/*/fields.vtkhdf
      - name: Without HDF5 and METIS
        if: runner.os == 'Linux'
        run: |
          cargo test -p cfdcraft-mesh --no-default-features --locked
          cargo test -p cfdcraft-fv --no-default-features --locked
      - uses: actions/upload-artifact@v4
        with:
          name: g1-ci-small-${{ matrix.os }}
          path: output/g1_ci_small/
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-reports-${{ matrix.os }}
          path: output/*/mesh_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: scalar-reports-${{ matrix.os }}
          path: |
            output/*/scalar.md
            output/*/*.svg

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  mpi:
    name: MPI, 4 ranks on one machine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Open MPI (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libclang-dev
      - name: Install Open MPI (macOS)
        if: runner.os == 'macOS'
        run: brew install open-mpi
      - run: cargo test -p cfdcraft-parallel --features mpi --locked
      - run: cargo build --release -p cfdcraft-parallel --features mpi --example mpi_smoke --locked
      - name: Run with 4 ranks
        run: mpirun --oversubscribe -n 4 target/release/examples/mpi_smoke
      - name: Run with 2 ranks
        run: mpirun --oversubscribe -n 2 target/release/examples/mpi_smoke
      - run: cargo build --release -p cfdcraft-mesh --features mpi --example mpi_halo --locked
      - name: Halo exchange of a partitioned mesh, 4 and 2 ranks
        run: |
          mpirun --oversubscribe -n 4 target/release/examples/mpi_halo
          mpirun --oversubscribe -n 2 target/release/examples/mpi_halo

  ptx:
    name: Single-source GPU kernels compile to PTX (G1 and stage 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads gpu/ptx-kernels/rust-toolchain.toml and installs nightly
      # with the nvptx64-nvidia-cuda target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpu/ptx-kernels -> ../../target
      - run: gpu/ptx-kernels/build.sh
      - name: No atomics, no f32, no contracted f64 arithmetic in the kernels (R10)
        run: tools/check_kernels.sh
      - run: gpu/ptx-kernels/build.sh sm_86
      - uses: actions/upload-artifact@v4
        with:
          name: g1-ptx
          path: target/nvptx64-nvidia-cuda/release/cfdcraft_ptx_kernels.ptx
